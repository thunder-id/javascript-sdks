# Entrypoint workflow for releasing JavaScript SDKs.
# Tick the SDKs you changed. The plan job adds every SDK that depends on them (read from the
# packages' package.json files, see scripts/release-plan.js), so a change to `browser` also
# releases `react`, `vue` and the rest. Selected SDKs take `bump_type`; added dependents take a
# patch. One job then bumps, builds and commits them together and publishes them in dependency
# order.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump for the SDKs you tick (SDKs that depend on them are added with a patch)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      confirm_major:
        description: 'Check to confirm intentional major bump (required when bump_type is major)'
        required: false
        type: boolean
        default: false

      sdk_better_auth:
        description: '@thunderid/better-auth'
        required: false
        type: boolean
        default: false

      sdk_browser:
        description: '@thunderid/browser'
        required: false
        type: boolean
        default: false

      sdk_express:
        description: '@thunderid/express'
        required: false
        type: boolean
        default: false

      sdk_javascript:
        description: '@thunderid/javascript'
        required: false
        type: boolean
        default: false

      sdk_nextjs:
        description: '@thunderid/nextjs'
        required: false
        type: boolean
        default: false

      sdk_node:
        description: '@thunderid/node'
        required: false
        type: boolean
        default: false

      sdk_nuxt:
        description: '@thunderid/nuxt'
        required: false
        type: boolean
        default: false

      sdk_react:
        description: '@thunderid/react'
        required: false
        type: boolean
        default: false

      sdk_react_router:
        description: '@thunderid/react-router'
        required: false
        type: boolean
        default: false

      sdk_tanstack_router:
        description: '@thunderid/tanstack-router'
        required: false
        type: boolean
        default: false

      sdk_vue:
        description: '@thunderid/vue'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # IMPORTANT: DO NOT REMOVE. `id-token` is required for OIDC publishing.
  id-token: write

env:
  RELEASE_GIT_USER_NAME: "thunderid[bot]"
  RELEASE_GIT_USER_EMAIL: "thunderid[bot]@users.noreply.thunderid.dev"
  NODE_VERSION: "lts/*"

jobs:
  test-e2e:
    name: 🎭 E2E (sample apps)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Least privilege: this job never pushes, comments, or writes to the repo — only the default
    # GITHUB_TOKEN's read access is needed for checkout.
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: 🎭 Run E2E suite
        uses: ./.github/actions/run-e2e-suite
        with:
          node-version: ${{ env.NODE_VERSION }}
          artifact-name: playwright-report-release

  plan:
    name: 📋 Plan Release
    needs: [test-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Guard against accidental major bump
        if: github.event.inputs.bump_type == 'major' && github.event.inputs.confirm_major != 'true'
        run: |
          echo "❌ bump_type is 'major' but confirm_major is not checked. Enable confirm_major to proceed."
          exit 1

      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Adds every SDK that depends on a selected one, and orders the list so dependencies publish
      # first. The plan is written to the job summary.
      - name: 📋 Work out the SDKs to release
        id: plan
        env:
          INPUTS: ${{ toJSON(github.event.inputs) }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          selected=$(node -e '
            const inputs = JSON.parse(process.env.INPUTS);
            console.log(Object.keys(inputs)
              .filter((key) => key.startsWith("sdk_") && String(inputs[key]) === "true")
              .map((key) => key.slice(4).replace(/_/g, "-"))
              .join(" "));
          ')
          node scripts/release-plan.js --bump "$BUMP_TYPE" $selected

  release:
    name: 🚀 Release SDKs
    needs: [plan]
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          # Full history and tags, so the release notes can find each SDK's previous tag.
          fetch-depth: 0

      - name: 📦 Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: latest

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      # Bumps every SDK in the plan before anything is built or published, so `workspace:^` ranges
      # resolve to the new versions: an SDK released alongside its dependency depends on the
      # version released with it.
      - name: 🏷️ Bump Versions
        run: |
          echo "$PLAN" | jq -c '.[]' | while read -r entry; do
            dir=$(jq -r '.dir' <<< "$entry")
            bump=$(jq -r '.bump' <<< "$entry")
            (cd "packages/$dir" && pnpm version "$bump" --no-git-tag-version --no-git-checks > /dev/null)
          done
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const plan = JSON.parse(process.env.PLAN).map((entry) => ({
              ...entry,
              version: JSON.parse(readFileSync(`packages/${entry.dir}/package.json`, "utf8")).version,
            }));
            writeFileSync(`${process.env.RUNNER_TEMP}/release.json`, JSON.stringify(plan));
            for (const { name, currentVersion, version } of plan) console.log(`${name}: ${currentVersion} → ${version}`);
          '

      - name: 🔨 Build
        run: |
          filters=$(jq -r '.[] | "--filter=\(.name)"' "$RUNNER_TEMP/release.json")
          pnpm turbo run build $filters

      # Each SDK's notes list the pull requests that changed it since its previous tag, grouped by
      # their `Type/*` label (.github/release.yml, enforced by pr-label-check.yml), in the same
      # format as the thunder-id/thunderid releases. The same notes go to the top of the SDK's
      # CHANGELOG.md, which the release commit carries. See scripts/release-notes.js.
      - name: 📝 Generate Release Notes & CHANGELOGs
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
        run: node scripts/release-notes.js "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/notes"

      - name: 📤 Commit, Tag & Push
        run: |
          git config user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"
          release="$RUNNER_TEMP/release.json"

          jq -r '.[] | "packages/\(.dir)/package.json packages/\(.dir)/CHANGELOG.md"' "$release" | xargs git add
          selected=$(jq -r '[.[] | select(.selected) | "\(.name)@\(.version)"] | join(", ")' "$release")
          added=$(jq '[.[] | select(.selected | not)] | length' "$release")
          subject="[Release] $selected"
          [ "$added" -gt 0 ] && subject="$subject and $added dependent SDK(s)"
          body=$(jq -r '.[] | "- \(.name)@\(.version) (\(.reason))"' "$release")
          git diff --cached --quiet || git commit -m "$subject" -m "$body"

          for i in $(seq 1 5); do
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }} && break
            [ "$i" -eq 5 ] && exit 1
            sleep $((i * 3))
          done

          tags=$(jq -r '.[] | "sdk/\(.dir)/v\(.version)"' "$release")
          for tag in $tags; do git tag "$tag"; done
          git push origin $tags

      # Publishes in plan order, which puts every SDK after the SDKs it depends on.
      - name: 📦 Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in $(jq -r '.[].dir' "$RUNNER_TEMP/release.json"); do
            (cd "packages/$dir" && pnpm publish --no-git-checks --access public --provenance)
          done

      - name: 🚀 Create GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
        run: |
          jq -c '.[]' "$RUNNER_TEMP/release.json" | while read -r entry; do
            dir=$(jq -r '.dir' <<< "$entry")
            tag=$(jq -r '"sdk/\(.dir)/v\(.version)"' <<< "$entry")
            title=$(jq -r '"\(.title) v\(.version)"' <<< "$entry")
            gh release create "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes/$dir.md"
          done
