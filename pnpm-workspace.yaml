  '@emotion/css': 11.13.5
  '@floating-ui/react': 0.27.12
  '@playwright/test': 1.60.0
  '@testing-library/react': 16.3.0
  '@thunderid/eslint-plugin': 1.0.1
  '@thunderid/prettier-config': 1.0.1
  '@types/node': 24.7.2
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  '@vitest/browser-playwright': 4.1.10
  base64url: 3.0.1
  buffer: 6.0.3
  core-js: 3.42.0
  cross-fetch: 4.1.0
  dompurify: 3.4.13
  eslint: 9.39.4
  fast-sha256: 1.3.0
  jose: 6.2.3
  jsdom: 27.0.1
  memory-cache: 0.2.0
  playwright: 1.60.0
  prettier: 3.6.2
  process: 0.11.10
  randombytes: 2.1.0
  react: 19.2.3
  react-dom: 19.2.3
  react-router: 7.18.2
  rimraf: 6.1.3
  rolldown: 1.0.0-beta.45
